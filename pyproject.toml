[project]
name = "docuvision-scanner"
version = "1.0.0"
description = "Computer vision project for automatic document scanning and capture quality analysis."
requires-python = ">=3.10"
dependencies = [
  "opencv-python>=4.8",
  "numpy>=1.24",
  "Pillow>=10.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

